# Builds the Mac app on GitHub's Apple Silicon and Intel Macs.
#  - Change VERSION and push to main  -> builds both and publishes Release v<VERSION>
#  - Or push a tag like v1.2.0         -> same, using the tag name
#  - "Run workflow" button             -> test build; download from the run's Artifacts
name: Build Mac app

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      model:
        description: "spaCy model to bundle (en_core_web_lg = best names, en_core_web_sm = smaller app)"
        required: false
        default: en_core_web_lg

permissions:
  contents: read

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (arm64)
            label: AppleSilicon
          - runner: macos-15-intel    # Intel (x86_64)
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build app (includes two self-tests)
        env:
          MODEL: ${{ github.event.inputs.model || 'en_core_web_lg' }}
        run: ./build_mac_app.sh

      - name: Name the disk image
        run: |
          mv dist/PDF-Redactor-*.dmg "dist/PDF-Redactor-${{ matrix.label }}.dmg"
          ls -lh dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Redactor-${{ matrix.label }}
          path: dist/PDF-Redactor-${{ matrix.label }}.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          ### Download
          - **Apple Silicon Macs** (M1, M2, M3, M4 and later): `PDF-Redactor-AppleSilicon.dmg`
          - **Intel Macs** (most Macs from before 2021): `PDF-Redactor-Intel.dmg`

          Not sure which you have? Apple menu → **About This Mac** → look for "Chip: Apple M…" (Apple Silicon) or "Processor: Intel".

          Open the .dmg and drag **PDF Redactor** to Applications. The first time you open it, macOS will say it can't verify the developer: go to **System Settings → Privacy & Security** and click **Open Anyway**.

          The app works completely offline and blocks its own network access. Always review the redacted file before sharing it. This software comes with no warranty.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing its files"
            gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" --title "PDF Redactor $TAG" --notes-file notes.md
          fi
